<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Install Skill</title>
  <link rel="stylesheet" href="../pi.css" />
</head>
<body>
  <form id="property-inspector" class="sdpi-wrapper">
    <div class="sdpi-item">
      <label data-i18n="Scheme">Deep link scheme</label>
      <select id="scheme" name="__scheme">
        <option value="workbuddy://">workbuddy://</option>
        <option value="workbuddy-ai://">workbuddy-ai://</option>
      </select>
      <div class="help" data-i18n="SchemeHelp">workbuddy:// for the domestic package, workbuddy-ai:// for WorkBuddy AI</div>
    </div>
    <div class="sdpi-item">
      <label data-i18n="SkillName">Skill name</label>
      <input type="text" name="skillname" />
    </div>
    <div class="sdpi-item">
      <label data-i18n="DownloadUrl">Download URL (HTTPS)</label>
      <input type="url" name="downloadurl" placeholder="https://" />
    </div>
    <div class="sdpi-item">
      <label data-i18n="ChannelType">Channel (optional)</label>
      <input type="text" name="channelType" />
    </div>
  </form>
  <script src="../setup.js"></script><script src="../pi-common.js"></script>
</body>
</html>
