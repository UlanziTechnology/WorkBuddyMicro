<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wake WorkBuddy</title>
  <link rel="stylesheet" href="../pi.css" />
</head>
<body>
  <form id="property-inspector" class="sdpi-wrapper">
    <div class="sdpi-item">
      <label data-i18n="Scheme">Deep link scheme</label>
      <select id="scheme" name="__scheme">
        <option value="workbuddy://">workbuddy://</option>
        <option value="workbuddy-ai://">workbuddy-ai://</option>
      </select>
      <div class="help" data-i18n="SchemeHelp">workbuddy:// for the domestic package, workbuddy-ai:// for WorkBuddy AI</div>
    </div>
    <div class="sdpi-item">
      <label data-i18n="TargetPage">Page after wake</label>
      <select name="target" id="target">
        <option value="home" data-page-key="Home">New task home</option>
        <option value="chat" data-page-key="OpenTask">Open task by ID</option>
        <option value="my-cloud-files" data-i18n="Page_my-cloud-files">My cloud files</option>
        <option value="projects" data-i18n="Page_projects">projects</option>
        <option value="experts" data-i18n="Page_experts">experts</option>
        <option value="skills" data-i18n="Page_skills">skills</option>
        <option value="connectors" data-i18n="Page_connectors">connectors</option>
        <option value="automation" data-i18n="Page_automation">automation</option>
        <option value="colleagues" data-i18n="Page_colleagues">colleagues</option>
        <option value="claw" data-i18n="Page_claw">claw</option>
        <option value="discover" data-i18n="Page_discover">discover</option>
        <option value="tencent-docs" data-i18n="Page_tencent-docs">tencent-docs</option>
        <option value="my-files" data-i18n="Page_my-files">my-files</option>
        <option value="ima" data-i18n="Page_ima">ima</option>
        <option value="lexiang" data-i18n="Page_lexiang">lexiang</option>
        <option value="agent-mail" data-i18n="Page_agent-mail">agent-mail</option>
        <option value="space" data-i18n="Page_space">space</option>
      </select>
      <div class="help" data-i18n="PageAvailability">Page availability depends on WorkBuddy version and enabled features. Unsupported destinations may leave the current page unchanged or return home. The cloud-files tab may share the same file list.</div>
    </div>
    <div class="sdpi-item hidden" id="taskid-row"><label data-i18n="TaskId">Task ID</label><input type="text" name="taskId"></div>
  </form>
  <script src="../setup.js"></script><script src="../pi-common.js"></script>
<script>
const target=document.getElementById('target');
function syncTaskId(){document.getElementById('taskid-row').classList.toggle('hidden',target.value!=='chat')}
target.addEventListener('change',syncTaskId);window.WorkBuddyPI.setFormFilledHook(syncTaskId);
</script></body>
</html>
