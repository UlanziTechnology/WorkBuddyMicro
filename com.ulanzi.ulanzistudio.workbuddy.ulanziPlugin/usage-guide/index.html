<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkBuddy · 使用说明 / Usage guide</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#e7efec;background:#101a19;color-scheme:dark}*{box-sizing:border-box}body{max-width:960px;margin:auto;padding:40px 24px 64px}header{display:flex;gap:24px;align-items:center;margin:16px 0 36px}header img{width:104px;border-radius:24px}h1{font-size:36px;margin:0 0 8px;letter-spacing:-1px}p{line-height:1.75;color:#b0c5bf}h2{font-size:23px;margin:38px 0 18px}button,a{color:#7ae2c0}button{background:#1b302b;border:1px solid #41695d;border-radius:8px;padding:8px 14px;float:right;cursor:pointer}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid #2f4941;border-radius:16px;padding:22px;background:#172722}.number{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#086d55;color:white;font-weight:700}h3{font-size:17px;margin:14px 0 8px}.states{display:flex;gap:16px;flex-wrap:wrap}.state{flex:1;text-align:center;min-width:150px}.state img{width:112px;height:112px;border-radius:20px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:15px 12px;border-bottom:1px solid #2f4941;line-height:1.7}th{color:#7ae2c0}details{border:1px solid #2f4941;border-radius:12px;padding:18px;margin:14px 0}summary{cursor:pointer;font-weight:600}code{background:#1d332b;padding:3px 6px;border-radius:4px}.note{border-left:3px solid #13bd92;padding-left:18px}footer{font-size:12px;color:#6c8e81;margin-top:44px}[hidden]{display:none!important}@media(max-width:620px){.steps{grid-template-columns:1fr}header{gap:16px}h1{font-size:28px}header img{width:80px}body{padding-top:24px}}
</style></head><body><button id="language" type="button">English</button>
<header><img src="../assets/states/spare.png" alt="WorkBuddy"><div><h1>WorkBuddy</h1><p data-zh="让按键和旋钮成为你的 AI 工作入口。" data-en="Your AI workspace, one press away."></p></div></header>
<h2 data-zh="三步开始使用" data-en="Get started in three steps"></h2>
<div class="steps">
<section class="card"><span class="number">1</span><h3 data-zh="安装并检查" data-en="Install and check"></h3><p data-zh="安装 WorkBuddy 桌面客户端。把插件的“唤起 WorkBuddy”或“WorkBuddy 状态”拖到按键上，属性面板会显示客户端、同步和当前状态。" data-en="Install WorkBuddy Desktop. Drag Wake WorkBuddy or WorkBuddy Status onto a key. The inspector checks the client, status sync and current state."></p><a href="https://www.workbuddy.cn/" data-zh="下载 WorkBuddy ↗" data-en="Download WorkBuddy ↗"></a></section>
<section class="card"><span class="number">2</span><h3 data-zh="启动 WorkBuddy" data-en="Launch WorkBuddy"></h3><p data-zh="按「启动 WorkBuddy」以 CDP 模式打开客户端。已连接时按键唤醒到前台，未连接时启动或重启至 CDP 模式。" data-en="Press Launch WorkBuddy to start in CDP mode. When connected, bring the client forward. When disconnected, start or restart in CDP mode."></p></section>
<section class="card"><span class="number">3</span><h3 data-zh="检查连接" data-en="Check the connection"></h3><p data-zh="属性栏显示 CDP 已连接后，即可使用语音输入、发送消息、当前会话状态和主题切换。" data-en="Once the inspector shows Connected, use Voice Input, Send Message, Current Session Status and Switch Theme."></p></section>
</div>
<h2 data-zh="看懂按键状态" data-en="Read the key at a glance"></h2><div class="states">
<div class="card state"><img src="../assets/states/spare.gif" alt="Idle"><h3 data-zh="绿色 · 待机" data-en="Green · Idle"></h3><p data-zh="WorkBuddy 已启动，等待任务。" data-en="WorkBuddy is running and ready."></p></div>
<div class="card state"><img src="../assets/states/running.gif" alt="Running"><h3 data-zh="黄色 · 运行" data-en="Yellow · Running"></h3><p data-zh="正在思考、调用工具或整理上下文。" data-en="Thinking, using tools or compacting context."></p></div>
<div class="card state"><img src="../assets/states/review.gif" alt="Review"><h3 data-zh="红色 · 请查看" data-en="Red · Review"></h3><p data-zh="任务完成、等待确认或发生异常。请在 WorkBuddy 查看。" data-en="Task completed, awaiting confirmation or an error. Check WorkBuddy."></p></div>
<div class="card state"><img src="../assets/states/offline.png" alt="Offline"><h3 data-zh="灰色 · CDP 未连接" data-en="Gray · Disconnected"></h3><p data-zh="使用「启动 WorkBuddy」连接客户端。" data-en="Use Launch WorkBuddy to connect."></p></div></div>
<h2 data-zh="配置你的动作" data-en="Configure your actions"></h2>
<table><thead><tr><th data-zh="动作" data-en="Action"></th><th data-zh="怎么用" data-en="How to use it"></th></tr></thead><tbody>
<tr><td data-zh="唤起 WorkBuddy / 状态" data-en="Wake / Status"></td><td data-zh="按下唤起客户端；按键实时显示状态。唤起动作还可选择进入的页面。" data-en="Press to open the client. Both keys display live status. Wake also lets you choose the target page."></td></tr>
<tr><td data-zh="任务 1–5" data-en="Task 1–5"></td><td data-zh="按 WorkBuddy 最近活动顺序显示已加载的五个任务，按键打开对应会话。" data-en="Show the five most recent loaded WorkBuddy tasks. Press to open the displayed chat."></td></tr>
<tr><td data-zh="新建任务" data-en="New Task"></td><td data-zh="设置提示词模板。支持 {clipboard}、{date}、{time}，以及目录、专家、技能、连接器和模型。最多 8000 字符。" data-en="Set a prompt template with {clipboard}, {date} and {time}, plus directory, expert, skills, connectors and model. Maximum 8000 characters."></td></tr>
<tr><td data-zh="页面直达" data-en="Open Page"></td><td data-zh="选择项目、技能、连接器、自动化等页面。打开指定任务时需填写任务 ID。未支持的页面可能停在当前页或返回首页；云文件可能共用文件列表。" data-en="Choose projects, skills, connectors, automation and more. Open Task requires a task ID. Unsupported pages may remain unchanged or return home; cloud files may share the file list."></td></tr>
<tr><td data-zh="模型切换 · 旋钮" data-en="Model Switch · Dial"></td><td data-zh="打开任务输入页并启用 CDP。转动旋钮切换客户端提供的模型，无需填写 ID。" data-en="Enable CDP and open the task composer. Turn the dial to switch models. No model IDs are needed."></td></tr>
<tr><td data-zh="安装 Skill" data-en="Install Skill"></td><td data-zh="填写名称和 HTTPS 下载地址，按下打开安装流程，在 WorkBuddy 中确认。" data-en="Enter a name and HTTPS download URL. Press to open the install flow and confirm in WorkBuddy."></td></tr>
<tr><td data-zh="当前会话状态 · 旋钮" data-en="Current Session Status · Dial"></td><td data-zh="启用 CDP 后，旋钮显示当前会话状态。遇到审批，左右转动选择允许一次、本次会话允许或拒绝，按下执行。灰色选项不可用。" data-en="Enable CDP to follow the current chat. Turn to select Allow once, Allow for this session, or Deny, then press to submit. Unavailable choices are dimmed."></td></tr>
<tr><td data-zh="一键换肤" data-en="Apply background"></td><td data-zh="为每个按键选择本地图片。键面显示 96×96 预览，按一次通过 CDP 应用主题，再按一次恢复默认主题。" data-en="Choose a local image per key. The key displays a 96×96 preview. Press to apply via CDP. Press again to restore the default theme."></td></tr>
<tr><td data-zh="语音输入 / 发送消息" data-en="Voice Input / Send Message"></td><td data-zh="启用 CDP 后，按语音键开始或结束录音，按发送键发送当前草稿。灰色表示不可用。" data-en="Enable CDP. Press Voice Input to start or finish recording. Press Send Message to send the current draft. Gray means unavailable."></td></tr>
<tr><td data-zh="积分余额" data-en="Credit Balance"></td><td data-zh="支持按键和旋钮，通过 CDP 读取账户剩余积分，每 30 秒刷新。按下立即刷新。断线或无法读取时显示灰色横线。" data-en="Show remaining account credits on a key or encoder through CDP every 30 seconds. Press to refresh. A gray dash indicates a disconnected or unavailable balance."></td></tr>
</tbody></table>
<p class="note" data-zh="新建任务只预填草稿，由你确认发送。国内客户端使用 workbuddy://，海外包使用 workbuddy-ai://；在动作属性面板选择协议。" data-en="New Task only prefills a draft; you confirm sending. Use workbuddy:// for the domestic client or workbuddy-ai:// for the overseas package, selected in the inspector."></p>
<details><summary data-zh="如何启用 CDP？" data-en="How do I enable CDP?"></summary><p data-zh="打开状态动作的使用引导，点击「重启 WorkBuddy」。点击后直接启动或重启 WorkBuddy。Windows 会强制结束所选安装路径的 WorkBuddy 进程（可能中断任务，请先保存）；macOS 正常退出后重新打开。连接成功后当前状态显示 CDP，断开后显示未连接。" data-en="Open the Status action setup and select Restart WorkBuddy. Click to start or restart WorkBuddy directly. On Windows this forcibly ends processes from the selected installation and may interrupt tasks; save work first. macOS quits normally before reopening. The status source shows CDP after connection and shows Disconnected if the connection drops."></p></details>
<footer>WorkBuddy · Ulanzi Studio Plugin 1.10.6</footer>
<script>
let en=new URLSearchParams(location.search).get('language')?.startsWith('en')||false;
function render(){document.documentElement.lang=en?'en':'zh-CN';document.querySelectorAll('[data-zh]').forEach(n=>n.textContent=n.dataset[en?'en':'zh']);document.getElementById('language').textContent=en?'中文':'English';}document.getElementById('language').onclick=()=>{en=!en;render()};render();
</script></body></html>
